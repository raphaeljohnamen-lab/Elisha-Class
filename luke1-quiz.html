<style>
  :root{
    --navy:#0f1b3d; --navy-deep:#0a1230; --gold:#d8b45c; --gold-soft:#f0dfa6;
    --parchment:#f7f0dc; --ok:#4c8c5b; --bad:#b5504a; --warn:#c98b3d;
    --btn-ink:#0a1230; --muted:#c9c2a6; --muted2:#9c977f; --muted3:#5c5842;
    --fb-ok:#9cd6a8; --fb-bad:#e5a8a3;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body[data-theme="light"]{
    --navy:#f6ecd2; --navy-deep:#fffaf0; --parchment:#241f10;
    --gold:#b5862c; --gold-soft:#8a6420; --ok:#2f6b3c; --bad:#a53f3a; --warn:#a06a1e;
    --muted:#5a5030; --muted2:#7a6f4a; --muted3:#9c8f5e;
    --fb-ok:#2f6b3c; --fb-bad:#a53f3a;
  }
  body[data-theme="light"] .stars{opacity:.35;}
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%; margin:0; font-family:'Cairo',sans-serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(216,180,92,0.12), transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(216,180,92,0.08), transparent 50%),
      linear-gradient(180deg,var(--navy-deep),var(--navy));
    color:var(--parchment); min-height:100%; display:flex; justify-content:center; padding:28px 16px 40px;
    transition:background .2s, color .2s;
  }
  body.lang-en{font-family:'Cormorant Garamond','Cairo',serif;}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .stars span{position:absolute;width:3px;height:3px;background:var(--gold-soft);border-radius:50%;opacity:.55;}
  .wrap{position:relative;z-index:1;width:100%;max-width:480px;}
  header{text-align:center;margin-bottom:22px;position:relative;}
  .eyebrow{color:var(--gold);font-size:.95rem;letter-spacing:.02em;margin-bottom:4px;}
  h1{font-family:'Aref Ruqaa',serif;font-size:2.1rem;margin:0 0 6px;color:var(--gold-soft);text-shadow:0 0 18px rgba(216,180,92,0.25);}
  body.lang-en h1{font-family:'Cormorant Garamond',serif;}
  .sub{color:var(--muted);font-size:.95rem;margin:0;}
  .top-controls{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;}
  .control-group{display:flex;gap:6px;align-items:center;}
  .mode-toggle{display:flex;border:1px solid rgba(216,180,92,0.35);border-radius:20px;overflow:hidden;}
  .mode-btn{background:none;border:none;color:var(--muted3);font-size:.72rem;cursor:pointer;font-family:'Cairo',sans-serif;padding:5px 11px;}
  .mode-btn.active{background:var(--gold);color:var(--btn-ink);font-weight:800;}
  .lang-toggle, .theme-toggle{background:none;border:1px solid rgba(216,180,92,0.3);border-radius:8px;color:var(--gold-soft);font-size:.75rem;cursor:pointer;font-family:'Cairo',sans-serif;padding:3px 8px;}
  .theme-toggle{padding:3px 7px;}
  .lang-toggle:hover, .theme-toggle:hover, .mode-btn:hover{color:var(--gold);border-color:var(--gold);}


  #game{background:rgba(255,255,255,0.03);border:1px solid rgba(216,180,92,0.25);border-radius:18px;padding:22px 20px 26px;backdrop-filter:blur(2px);}

  .progress{display:flex;gap:6px;margin-bottom:16px;}
  .progress i{flex:1;height:5px;border-radius:3px;background:rgba(216,180,92,0.18);overflow:hidden;position:relative;}
  .progress i.done::after{content:'';position:absolute;inset:0;background:var(--gold);}
  .progress i.current::after{content:'';position:absolute;inset:0;background:var(--gold-soft);}

  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;}
  .qnum{color:var(--gold);font-size:.85rem;}
  .timer-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .timer-badge{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:var(--gold-soft);transition:border-color .2s, color .2s;}
  .timer-badge.warn{border-color:var(--warn);color:var(--warn);}
  .timer-badge.danger{border-color:var(--bad);color:var(--fb-bad);}
  .timer-bar{height:5px;border-radius:3px;background:rgba(216,180,92,0.18);margin-bottom:18px;overflow:hidden;}
  .timer-bar-fill{height:100%;background:var(--gold);width:100%;transition:width .1s linear, background .2s;}
  .timer-bar-fill.warn{background:var(--warn);}
  .timer-bar-fill.danger{background:var(--bad);}

  .qtext{font-family:'Aref Ruqaa',serif;font-size:1.5rem;line-height:1.7;margin:0 0 20px;color:var(--parchment);white-space:pre-line;}
  body.lang-en .qtext{font-family:'Cormorant Garamond',serif;font-size:1.6rem;}

  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{text-align:inherit;background:rgba(247,240,220,0.04);border:1px solid rgba(216,180,92,0.3);color:var(--parchment);font-family:inherit;font-size:1.05rem;padding:14px 16px;border-radius:12px;cursor:pointer;transition:transform .12s ease, background .15s ease, border-color .15s ease;}
  .choice:hover{border-color:var(--gold);}
  .choice:active{transform:scale(0.99);}
  .choice.correct{background:rgba(76,140,91,0.25);border-color:var(--ok);}
  .choice.wrong{background:rgba(181,80,74,0.25);border-color:var(--bad);}
  .choice[disabled]{cursor:default;}

  .feedback{min-height:26px;margin-top:14px;font-size:.98rem;font-weight:600;}
  .feedback.ok{color:var(--fb-ok);}
  .feedback.bad{color:var(--fb-bad);}
  .points-pill{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:20px;background:rgba(216,180,92,0.15);color:var(--gold-soft);font-size:.85rem;font-weight:700;}

  .next-btn, .primary-btn{margin-top:18px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--gold);color:var(--btn-ink);font-family:'Cairo',sans-serif;font-weight:800;font-size:1.05rem;cursor:pointer;}
  .next-btn{display:none;}
  .next-btn.show{display:block;}
  .primary-btn:disabled{opacity:.5;cursor:default;}

  .secondary-btn{margin-top:10px;width:100%;padding:12px;border:1px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold-soft);font-family:'Cairo',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;}
  .secondary-btn:hover{background:rgba(216,180,92,0.1);}

  .danger-btn{margin-top:10px;width:100%;padding:12px;border:1px solid var(--bad);border-radius:12px;background:transparent;color:var(--fb-bad);font-family:'Cairo',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;}
  .danger-btn.confirming{background:var(--bad);color:var(--parchment);}

  .result{text-align:center;}
  .result .medal{font-size:3rem;margin-bottom:8px;}
  .result h2{font-family:'Aref Ruqaa',serif;font-size:1.9rem;color:var(--gold-soft);margin:0 0 6px;}
  body.lang-en .result h2{font-family:'Cormorant Garamond',serif;}
  .result p{color:var(--muted);margin:0 0 16px;}
  .score-line{font-size:1.3rem;font-weight:800;color:var(--gold);margin-bottom:2px;}
  .score-sub{font-size:.9rem;color:var(--muted);margin-bottom:14px;}
  .save-note{font-size:.85rem;color:var(--muted2);margin-bottom:14px;min-height:18px;}

  .login h2, .servant h2{font-family:'Aref Ruqaa',serif;font-size:1.7rem;color:var(--gold-soft);margin:0 0 6px;text-align:center;}
  body.lang-en .login h2, body.lang-en .servant h2{font-family:'Cormorant Garamond',serif;}
  .login p, .servant p{color:var(--muted);text-align:center;margin:0 0 18px;font-size:.95rem;}
  .name-input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(216,180,92,0.35);background:rgba(247,240,220,0.05);color:var(--parchment);font-family:'Cairo',sans-serif;font-size:1.05rem;text-align:center;}
  .name-input:focus{outline:none;border-color:var(--gold);}

  .board-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .board-row{display:flex;align-items:center;justify-content:space-between;background:rgba(247,240,220,0.04);border:1px solid rgba(216,180,92,0.2);border-radius:10px;padding:10px 14px;font-size:.98rem;}
  .board-row.me{border-color:var(--gold);background:rgba(216,180,92,0.1);}
  .board-rank{color:var(--gold);font-weight:800;width:26px;}
  .board-name{flex:1;text-align:inherit;padding:0 10px;}
  .board-score{color:var(--gold-soft);font-weight:700;}
  .board-empty{text-align:center;color:var(--muted2);padding:20px 0;}
  .servant-note{font-size:.85rem;color:var(--muted2);text-align:center;min-height:18px;margin-top:8px;}

  .qedit-block{border:1px solid rgba(216,180,92,0.2);border-radius:12px;padding:14px;margin-bottom:14px;}
  .qedit-label{color:var(--gold);font-size:.85rem;margin-bottom:8px;font-weight:700;}
  .qedit-block textarea.name-input{resize:vertical;min-height:54px;text-align:inherit;margin-bottom:10px;}
  .qedit-opt{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .qedit-opt .opt-letter{color:var(--gold-soft);font-weight:800;width:20px;flex-shrink:0;}
  .qedit-opt input[type="text"]{flex:1;padding:9px 12px;}
  .qedit-correct{margin-top:6px;}
  .qedit-correct-label{color:var(--muted);font-size:.8rem;margin-bottom:6px;}
  .qedit-radios{display:flex;gap:14px;flex-wrap:wrap;}
  .qedit-radios label{display:flex;align-items:center;gap:5px;font-size:.9rem;color:var(--parchment);cursor:pointer;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <header>

function applyLangChrome(){

  document.getElementById('servantModeBtn').classList.toggle('active', mode === 'servant');

}

// ---------- LOGIN ----------
function renderLogin(){
  stopTimer();
  setMode('student');
  gameEl.innerHTML = `
    <div class="login">
      <h2>${t().loginTitle}</h2>
      <p>${t().loginSub}</p>
      <input type="text" inputmode="numeric" class="name-input" id="idInput" placeholder="${t().idPlaceholder}" maxlength="10" autofocus>
      <button class="primary-btn" id="startBtn" style="margin-top:14px" disabled>${t().startBtn}</button>
      <div class="servant-note" id="idNote"></div>
      <button class="secondary-btn" id="viewBoardBtn">${t().viewBoardBtn}</button>
    </div>
  `;
  const input = document.getElementById('idInput');
  const startBtn = document.getElementById('startBtn');
  const note = document.getElementById('idNote');
  input.addEventListener('input', ()=>{
    startBtn.disabled = input.value.trim().length === 0;
    note.textContent = '';
  });
  const tryLogin = ()=>{
    const id = input.value.trim();
    if(!id) return;
    const match = STUDENTS.find(s=>s.id === id);
    if(match){ beginQuiz(`${match.firstName} ${match.lastName}`); }
    else { note.textContent = t().idWrong; }
  };
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryLogin(); });
  startBtn.addEventListener('click', tryLogin);
  document.getElementById('viewBoardBtn').addEventListener('click', ()=>renderLeaderboard(false));
}

function beginQuiz(name){ playerName = name; current = 0; score = 0; correctCount = 0; renderQuestion(); }

// ---------- QUIZ ----------
function renderProgress(){
  let html = '<div class="progress">';
  for(let i=0;i<ACTIVE_QUESTIONS.length;i++){
    let cls = i < current ? 'done' : (i === current ? 'current' : '');
    html += `<i class="${cls}"></i>`;
  }
  return html + '</div>';
}

function renderQuestion(){
  const item = ACTIVE_QUESTIONS[current];
  const letters = lang === 'ar' ? ['أ','ب','ج','د'] : ['A','B','C','D'];
  let html = renderProgress();
  html += `<div class="qhead">
      <div class="qnum">${t().qLabel(playerName, current+1, ACTIVE_QUESTIONS.length)}</div>
      <div class="timer-wrap"><div class="timer-badge" id="timerBadge">${TIME_LIMIT}</div></div>
    </div>`;
  html += `<div class="timer-bar"><div class="timer-bar-fill" id="timerFill"></div></div>`;
  html += `<p class="qtext">${item.q}</p><div class="choices">`;
  item.choices.forEach((c,i)=>{ html += `<button class="choice" data-i="${i}">${letters[i]}) ${c}</button>`; });
  html += '</div><div class="feedback" id="feedback"></div>';
  html += `<button class="next-btn" id="nextBtn">${t().nextBtn}</button>`;
  gameEl.innerHTML = html;

  document.querySelectorAll('.choice').forEach(btn=>{ btn.addEventListener('click', ()=>handleAnswer(parseInt(btn.dataset.i))); });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  startTimer();
}

function startTimer(){
  stopTimer(); timeLeft = TIME_LIMIT; updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft -= 0.1;
    if(timeLeft <= 0){ timeLeft = 0; updateTimerDisplay(); stopTimer(); handleAnswer(-1); return; }
    updateTimerDisplay();
  }, 100);
}
function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
function updateTimerDisplay(){
  const badge = document.getElementById('timerBadge'), fill = document.getElementById('timerFill');
  if(!badge || !fill) return;
  const pct = Math.max(0, (timeLeft / TIME_LIMIT) * 100);
  fill.style.width = pct + '%'; badge.textContent = Math.ceil(timeLeft);
  badge.classList.remove('warn','danger'); fill.classList.remove('warn','danger');
  if(timeLeft <= 5 && timeLeft > 2){ badge.classList.add('warn'); fill.classList.add('warn'); }
  else if(timeLeft <= 2){ badge.classList.add('danger'); fill.classList.add('danger'); }
}

function handleAnswer(i){
  stopTimer();
  const item = ACTIVE_QUESTIONS[current];
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b=>b.disabled = true);
  const feedback = document.getElementById('feedback');
  if(i === item.correct){
    buttons[i].classList.add('correct');
    const earned = Math.max(MIN_POINTS, Math.round(MAX_POINTS * (timeLeft / TIME_LIMIT)));
    score += earned; correctCount++;
    feedback.innerHTML = `${t().correctFb}<br><span class="points-pill">${t().pointsPill(earned)}</span>`;
    feedback.classList.add('ok');
  } else {
    if(i >= 0) buttons[i].classList.add('wrong');
    buttons[item.correct].classList.add('correct');
    feedback.textContent = (i === -1) ? t().timeoutFb : t().wrongFb;
    feedback.classList.add('bad');
  }
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  current++;
  if(current < ACTIVE_QUESTIONS.length) renderQuestion(); else renderResult();
}

// ---------- RESULT ----------
async function renderResult(){
  stopTimer();
  let medal = '⭐', msg = t().msgTryAgain;
  if(correctCount === ACTIVE_QUESTIONS.length){ medal='🏆'; msg=t().msgPerfect; }
  else if(correctCount >= ACTIVE_QUESTIONS.length - 1){ medal='🌟'; msg=t().msgGreat; }

  gameEl.innerHTML = `
    <div class="result">
      <div class="medal">${medal}</div>
      <h2>${t().resultTitle}</h2>
      <div class="score-line">${t().scoreLine(playerName, score)}</div>
      <div class="score-sub">${t().scoreSub(correctCount, ACTIVE_QUESTIONS.length)}</div>
      <p>${msg}</p>
      <div class="save-note" id="saveNote">${t().saving}</div>
      <button class="primary-btn" id="boardBtn">${t().boardBtn}</button>
      <button class="secondary-btn" id="restartBtn">${t().restartBtn}</button>
    </div>
  `;
  document.getElementById('boardBtn').addEventListener('click', ()=>renderLeaderboard(false));
  document.getElementById('restartBtn').addEventListener('click', renderLogin);

  const note = document.getElementById('saveNote');
  if(db){
    try{
      await db.collection('scores').add({ name: playerName, score, correct: correctCount, total: ACTIVE_QUESTIONS.length, lang, at: Date.now() });
      note.textContent = t().saved;
    }catch(e){ note.textContent = ''; }
  } else { note.textContent = ''; }
}

// ---------- LEADERBOARD ----------
async function renderLeaderboard(fromServant){
  setMode(fromServant ? 'servant' : 'student');
  gameEl.innerHTML = `
    <h2 style="font-family:'Aref Ruqaa',serif;font-size:1.7rem;color:var(--gold-soft);text-align:center;margin:0 0 16px;">${t().boardTitle}</h2>
    <div id="boardBody" class="board-empty">${t().boardLoading}</div>
    <button class="secondary-btn" id="backBtn">${t().backBtn}</button>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> fromServant ? renderServantPanel() : renderLogin());
  const body = document.getElementById('boardBody');
  if(!db){ body.innerHTML = `<div class="board-empty">${t().boardUnavailable}</div>`; return; }

  try{
    const snap = await db.collection('scores').orderBy('score','desc').limit(fromServant ? 100 : 10).get();
    const docs = snap.docs || [];
    if(docs.length === 0){ body.innerHTML = `<div class="board-empty">${t().boardEmpty}</div>`; return; }
    const medals = ['🥇','🥈','🥉'];
    let html = '<ul class="board-list">';
    docs.forEach((d,i)=>{
      const data = d.data();
      const isMe = !fromServant && data.name === playerName && data.score === score;
      html += `<li class="board-row ${isMe ? 'me' : ''}">
        <span class="board-rank">${medals[i] || (i+1)}</span>
        <span class="board-name">${escapeHtml(data.name || t().unknown)}</span>
        <span class="board-score">${data.score}</span>
      </li>`;
    });
    html += '</ul>';
    body.outerHTML = html;
  }catch(e){ body.innerHTML = `<div class="board-empty">${t().boardError}</div>`; }
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

      <button class="primary-btn" id="pinBtn" style="margin-top:14px">${t().loginBtn}</button>
      <div class="servant-note" id="pinNote"></div>
      <button class="secondary-btn" id="pinBackBtn">${t().backBtn}</button>
    </div>
  `;
  document.getElementById('pinBackBtn').addEventListener('click', renderLogin);
  const tryPin = ()=>{
    const selectedName = document.getElementById('servantSelect').value;
    const val = document.getElementById('pinInput').value.trim();
    const match = SERVANTS.find(s=>s.name === selectedName && s.pin === val);
    if(match){ loggedInServant = match.name; renderServantPanel(); }
    else { document.getElementById('pinNote').textContent = t().pinWrong; }
  };
  document.getElementById('pinBtn').addEventListener('click', tryPin);
  document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryPin(); });
}

function renderServantPanel(){
  stopTimer();
  setMode('servant');
  gameEl.innerHTML = `
    <div class="servant">
      <h2>${t().servantPanelTitle}</h2>
      <p>${t().servantGreeting(loggedInServant)}</p>
      <button class="primary-btn" id="viewFullBoard">${t().viewFullBoard}</button>
      <button class="primary-btn" id="editQuestionsBtn">${t().editQuestions}</button>
      <button class="danger-btn" id="resetBoardBtn">${t().resetBoard}</button>
      <button class="danger-btn" id="resetQuestionsBtn">${t().resetQuestions}</button>
      <div class="servant-note" id="servantNote"></div>
      <button class="secondary-btn" id="servantBackBtn">${t().logoutBtn}</button>
    </div>
  `;
  document.getElementById('viewFullBoard').addEventListener('click', ()=>renderLeaderboard(true));
  document.getElementById('editQuestionsBtn').addEventListener('click', renderQuestionEditor);
  document.getElementById('servantBackBtn').addEventListener('click', ()=>{ loggedInServant=""; renderLogin(); });
  setupConfirmButton('resetBoardBtn', t().resetBoard, t().confirmTap, resetLeaderboard);
  setupConfirmButton('resetQuestionsBtn', t().resetQuestions, t().confirmTap, resetQuestions);
}

function setupConfirmButton(id, idleLabel, confirmLabel, action){
  const btn = document.getElementById(id);
  let confirming = false;
  btn.textContent = idleLabel;
  btn.addEventListener('click', async ()=>{
    if(!confirming){ confirming = true; btn.textContent = confirmLabel; btn.classList.add('confirming'); return; }
    confirming = false; btn.classList.remove('confirming'); btn.disabled = true;
    await action();
    btn.textContent = idleLabel; btn.disabled = false;
  });
}

async function resetLeaderboard(){
  const note = document.getElementById('servantNote');
  if(!db){ note.textContent = t().dbUnavailable; return; }
  note.textContent = t().clearing;
  try{
    const snap = await db.collection('scores').limit(500).get();
    for(const d of snap.docs){ await db.collection('scores').doc(d.id).delete(); }
    note.textContent = t().cleared;
  }catch(e){ note.textContent = t().clearError; }
}

async function resetQuestions(){
  const note = document.getElementById('servantNote');
  if(!db){ note.textContent = t().dbUnavailable; return; }
  note.textContent = t().resetting;
  try{
    await db.doc('config/questions').delete();
    ACTIVE_QUESTIONS = QUESTIONS_DEFAULT[lang];
    note.textContent = t().resetDone;
  }catch(e){ note.textContent = t().resetError; }
}

// ---------- QUESTION EDITOR ----------
function renderQuestionEditor(){
  stopTimer();
  setMode('servant');
  const letters = t().optionLabels;
  let html = `<div class="servant"><h2>${t().editorTitle}</h2>`;
  ACTIVE_QUESTIONS.forEach((item, qi)=>{
    html += `<div class="qedit-block" data-qi="${qi}">
      <div class="qedit-label">${t().questionLabel(qi+1)}</div>
      <textarea class="name-input" id="qedit-text-${qi}">${escapeHtml(item.q)}</textarea>`;
    item.choices.forEach((c, oi)=>{
      html += `<div class="qedit-opt">
        <span class="opt-letter">${letters[oi]})</span>
        <input type="text" class="name-input" id="qedit-opt-${qi}-${oi}" value="${escapeHtml(c)}">
      </div>`;
    });
    html += `<div class="qedit-correct">
      <div class="qedit-correct-label">${t().correctLabel}</div>
      <div class="qedit-radios">`;
    letters.forEach((l, oi)=>{
      html += `<label><input type="radio" name="qedit-correct-${qi}" value="${oi}" ${item.correct===oi?'checked':''}> ${l}</label>`;
    });
    html += `</div></div></div>`;
  });
  html += `<button class="primary-btn" id="saveQuestionsBtn">${t().saveBtn}</button>
    <div class="servant-note" id="editorNote"></div>
    <button class="secondary-btn" id="editorBackBtn">${t().backBtn}</button></div>`;
  gameEl.innerHTML = html;
  document.getElementById('editorBackBtn').addEventListener('click', renderServantPanel);
  document.getElementById('saveQuestionsBtn').addEventListener('click', saveQuestions);
}

async function saveQuestions(){
  const note = document.getElementById('editorNote');
  const updated = ACTIVE_QUESTIONS.map((item, qi)=>{
    const q = document.getElementById(`qedit-text-${qi}`).value.trim();
    const choices = item.choices.map((c, oi)=>document.getElementById(`qedit-opt-${qi}-${oi}`).value.trim());
    const checked = document.querySelector(`input[name="qedit-correct-${qi}"]:checked`);
    const correct = checked ? parseInt(checked.value) : item.correct;
    return { q, choices, correct };
  });

  QUESTIONS_DEFAULT[lang] = updated;
  ACTIVE_QUESTIONS = updated;

  if(!db){ note.textContent = t().dbUnavailable; return; }
  note.textContent = t().saving;
  try{
    let existing = {};
    try{
      const snap = await db.doc('config/questions').get();
      if(snap.exists) existing = snap.data() || {};
    }catch(e){}
    existing[lang] = updated;
    await db.doc('config/questions').set(existing);
    note.textContent = t().saveDone;
  }catch(e){
    note.textContent = t().saveError;
  }
}

applyLangChrome();
applyTheme();
renderStars();
renderLogin();
</script>
</body>
